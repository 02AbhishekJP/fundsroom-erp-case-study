databases:
  - name: fundsroom-db
    plan: free
    databaseName: fundsroom_prod
    user: erp_admin

services:
  - type: web
    name: fundsroom-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fundsroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: 'true'

  - type: web
    name: fundsroom-ui
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: fundsroom-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
