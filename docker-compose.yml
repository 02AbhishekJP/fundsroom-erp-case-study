version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fundsroom-erp-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fundsroom_erp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fundsroom_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fundsroom-erp-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-fundsroom_erp}
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - CORS_ORIGIN=http://localhost:8080,http://localhost:5173
    ports:
      - "3000:3000"
    networks:
      - erp-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
    container_name: fundsroom-erp-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - erp-network

volumes:
  postgres_data:

networks:
  erp-network:
    driver: bridge
